<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login</title>
    <!-- Load Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ensuring Inter font is used and background has a gradient */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Light gray background */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Login Card Container -->
    <div class="w-full max-w-sm bg-white p-8 rounded-xl shadow-2xl border border-gray-100">
        <h1 class="text-3xl font-extrabold text-gray-800 text-center mb-6">Staff Login</h1>
        <p class="text-center text-sm text-gray-500 mb-8">Access the Attendance & Scheduling System</p>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="event.preventDefault(); loginUser();">
            
            <!-- Username Input -->
            <div class="mb-5">
                <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    required 
                    autocomplete="username"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-sky-500 focus:border-sky-500 transition duration-150 shadow-sm"
                    placeholder="Enter your username"
                >
            </div>

            <!-- Password Input -->
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    autocomplete="current-password"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-sky-500 focus:border-sky-500 transition duration-150 shadow-sm"
                    placeholder="********"
                >
            </div>

            <!-- Error Message Area -->
            <div id="message" class="text-red-600 text-sm mb-4 hidden"></div>

            <!-- Login Button -->
            <button 
                type="submit" 
                class="w-full py-3 px-4 bg-sky-600 text-white font-semibold rounded-lg shadow-md hover:bg-sky-700 focus:outline-none focus:ring-4 focus:ring-sky-500 focus:ring-opacity-50 transition duration-200"
            >
                Log In
            </button>
            
        </form>
    </div>
    
    <!-- Link to the JavaScript file where the loginUser() function is defined -->
    <script src="app.js"></script>
</body>
</html>
